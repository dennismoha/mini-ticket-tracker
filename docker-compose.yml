services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-ticket-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mini_ticket_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mini_ticket_tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_ticket_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mini_ticket_tracker_pgdata:
